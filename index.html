<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Photobooth</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Mencegah scroll */
        }
        /* Video Kamera */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Biar penuh di layar */
        }
        /* UI Overlay di atas kamera */
        .ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Biar video di belakangnya tidak keblokir */
        }
        .top-bar {
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .bottom-bar {
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto; /* Mengaktifkan klik di area bawah */
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }
        /* Tombol-tombol */
        .btn {
            background: none; border: none; color: white;
            font-size: 30px; cursor: pointer;
            width: 60px; height: 60px;
            display: flex; justify-content: center; align-items: center;
        }
        .shutter-btn {
            width: 75px; height: 75px;
            border-radius: 50%;
            background-color: white;
            border: 4px solid #ddd;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .shutter-btn:active { transform: scale(0.9); }
        .shutter-btn:disabled { background-color: #555; border-color: #333; }
        
        .btn-check { color: #00ff88; display: none; } /* Disembunyikan awalnya */

        /* Modal / Pop-up Input Nama */
        .modal {
            display: none; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
            pointer-events: auto; z-index: 10;
        }
        .modal-content {
            background: white; color: black;
            padding: 25px; border-radius: 15px;
            text-align: center; width: 80%; max-width: 300px;
        }
        .modal-content input {
            width: 90%; padding: 10px; margin: 15px 0;
            border: 1px solid #ccc; border-radius: 5px;
            font-size: 16px;
        }
        .modal-content button {
            background: #007bff; color: white;
            border: none; padding: 10px 20px;
            border-radius: 5px; font-size: 16px; width: 100%;
            cursor: pointer;
        }
        /* Efek Flash (Kilatan saat foto) */
        #flash {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: white; opacity: 0;
            pointer-events: none; transition: opacity 0.1s;
        }
        /* Loading Screen */
        #loading {
            display: none; position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); color: white;
            justify-content: center; align-items: center; z-index: 20;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- Area Kamera -->
    <video id="camera-feed" autoplay playsinline></video>
    <div id="flash"></div>
    <canvas id="canvas" style="display: none;"></canvas>

    <!-- UI Overlay -->
    <div class="ui-container">
        <div class="top-bar">
            Kuota Foto: <span id="counter">0</span> / 18
        </div>
        <div class="bottom-bar">
            <!-- Tombol Switch Kamera (Depan/Belakang) -->
            <button class="btn" onclick="switchCamera()">🔄</button>
            
            <!-- Tombol Jepret -->
            <button class="shutter-btn" id="shutter" onclick="takePhoto()"></button>
            
            <!-- Tombol Centang (Selesai) -->
            <button class="btn btn-check" id="finish-btn" onclick="showModal()">✅</button>
        </div>
    </div>

    <!-- Modal Input Nama -->
    <div class="modal" id="name-modal">
        <div class="modal-content">
            <h3>Selesai Foto!</h3>
            <p>Masukkan namamu untuk membuat folder Drive:</p>
            <input type="text" id="user-name" placeholder="Contoh: Ardi" autocomplete="off">
            <button onclick="sendPhotos()">Kirim Foto ke Drive</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading">
        <h2>Sedang Mengirim...</h2>
        <p>Tunggu sebentar, sedang membuat folder dan upload foto.</p>
    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL DARI TAHAP 1
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-Jj1n32O9FPnboHIP0Mw5KJQuTjVkqGlGA0CCOCscNjqn7-Gmx5sJUk7h48kXpGMU/exec';
        // ==========================================

        let video = document.getElementById('camera-feed');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let currentFacingMode = 'environment'; // Default: Kamera Belakang (environment)
        let stream = null;
        
        let photos = [];
        const MAX_PHOTOS = 18;

        // Mengambil Parameter ID Folder dari URL (Nanti ini dari hasil scan QR)
        const urlParams = new URLSearchParams(window.location.search);
        let folderId = urlParams.get('folderId'); // Contoh: ?folderId=1aBc...

        // --- TAMBAHKAN SENSOR KADALUARSA 7 HARI DI SINI ---
        let expTime = urlParams.get('exp');
        if (expTime && Date.now() > parseInt(expTime)) {
            document.body.innerHTML = "<div style='color:white; text-align:center; padding:50px; font-family:Arial;'><h2>⛔ Akses Ditolak</h2><p>QR Code ini sudah kadaluarsa (lebih dari 7 hari).</p><p>Silakan minta admin membuat QR Code baru.</p></div>";
            throw new Error("QR Expired"); 
        }

        // Memulai Kamera
        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop()); // Stop kamera sebelumnya jika switch
            }
            
            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 4096 }, // Meminta resolusi maksimal
                    height: { ideal: 4096 }
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal mengakses kamera: " + err.message);
            }
        }

        // Fungsi Switch Kamera
        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        // Fungsi Jepret Foto
        function takePhoto() {
            if (photos.length >= MAX_PHOTOS) return;

            // Set ukuran canvas sama persis dengan resolusi asli kamera (agar HQ)
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Gambar frame saat ini ke canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Ubah ke format Base64 (JPG)
            let base64Image = canvas.toDataURL('image/jpeg', 0.9); // 0.9 = Quality 90%
            photos.push(base64Image);
            
            // Efek Flash
            let flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            // Update UI
            document.getElementById('counter').innerText = photos.length;
            document.getElementById('finish-btn').style.display = 'flex'; // Munculkan tombol centang

            if (photos.length >= MAX_PHOTOS) {
                document.getElementById('shutter').disabled = true; // Matikan tombol jika batas tercapai
            }
        }

        // Fungsi Memunculkan Modal
        function showModal() {
            if (!folderId) {
                alert("Error: ID Folder tujuan tidak ditemukan! Pastikan scan dari QR Code yang benar.");
                return;
            }
            document.getElementById('name-modal').style.display = 'flex';
        }

        // Fungsi Kirim Foto ke Google Drive (GAS)
        async function sendPhotos() {
            let nameInput = document.getElementById('user-name').value.trim();
            if (nameInput === "") {
                alert("Nama tidak boleh kosong!");
                return;
            }

            document.getElementById('name-modal').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            let payload = {
                mainFolderId: folderId,
                userName: nameInput,
                images: photos
            };

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8", // Trik agar GAS tidak error CORS
                    },
                    body: JSON.stringify(payload)
                });
                
                let result = await response.json();
                
                if (result.status === "sukses") {
                    alert("Sukses! Fotomu berhasil disimpan di folder: " + result.folder);
                    window.location.reload(); // Refresh halaman setelah sukses
                } else {
                    alert("Gagal menyimpan: " + result.error);
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan atau server.");
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Jalankan kamera saat web dibuka
        startCamera();
    </script>
</body>
</html>
