<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Photobooth</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        
        .top-bar { position: absolute; top: 30px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .counter { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); color: white; padding: 6px 14px; border-radius: 15px; font-size: 16px; font-weight: 500; letter-spacing: 1px; }
        
        .bottom-bar { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: space-evenly; align-items: center; z-index: 10; }
        
        /* Desain Glassmorphism Modern */
        .btn-switch { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 50px; height: 50px; font-size: 20px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .btn-shutter { background: transparent; border: 3px solid white; border-radius: 50%; width: 70px; height: 70px; cursor: pointer; position: relative; }
        .btn-shutter::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 56px; height: 56px; border-radius: 50%; transition: 0.1s; }
        .btn-shutter:active::after { width: 48px; height: 48px; }
        
        /* Tombol Centang Biru Elegan */
        .btn-done { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 50px; height: 50px; font-size: 24px; color: #0A84FF; cursor: pointer; display: none; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: bold; }
        
        #flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s; }
        
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 30; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .modal-box { background: white; padding: 25px; border-radius: 15px; width: 80%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-box h3 { margin-top: 0; color: #333; }
        .modal-box p { color: #666; font-size: 14px; }
        .modal-box input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        .modal-box input:focus { border-color: #0A84FF; }
        .modal-box button { background: #0A84FF; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        
        #loading-text { color: white; margin-top: 20px; font-size: 16px; display: none; font-weight: 500; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <div id="flash-effect"></div>

    <div class="top-bar">
        <div class="counter"><span id="photo-count">0</span> / 18</div>
    </div>

    <div class="bottom-bar">
        <button class="btn-switch" id="btn-switch">🔄</button>
        <button class="btn-shutter" id="btn-shutter"></button>
        <button class="btn-done" id="btn-done">✔</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-box" id="input-box">
            <h3>Selesai Foto!</h3>
            <p>Masukkan namamu untuk membuat folder:</p>
            <input type="text" id="user-name" placeholder="Contoh: Ardi" required autocomplete="off">
            <button id="btn-submit">Kirim ke Drive</button>
        </div>
        <div id="loading-text">Sedang memproses foto... ⏳</div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-Jj1n32O9FPnboHIP0Mw5KJQuTjVkqGlGA0CCOCscNjqn7-Gmx5sJUk7h48kXpGMU/exec";

        let video = document.getElementById('camera-feed');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let currentFacingMode = 'user';
        let capturedImages = [];
        const MAX_PHOTOS = 18;

        const urlParams = new URLSearchParams(window.location.search);
        let mainFolderId = urlParams.get('folderId'); 

        let expTime = urlParams.get('exp');
        if (expTime && Date.now() > parseInt(expTime)) {
            document.body.innerHTML = "<div style='color:white; text-align:center; padding:50px; font-family:sans-serif;'><h2>⛔ Akses Ditolak</h2><p>QR Code ini sudah kadaluarsa.</p></div>";
            throw new Error("QR Expired"); 
        }

        async function startCamera(facingMode) {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            
            // Perbaikan Performa: Diturunkan dari 4096px ke 1920px (1080p)
            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 1920 }, 
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal mengakses kamera.");
            }
        }

        document.getElementById('btn-switch').addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(currentFacingMode);
        });

        document.getElementById('btn-shutter').addEventListener('click', () => {
            if (capturedImages.length >= MAX_PHOTOS) return;

            let flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Kompresi ringan (0.8) agar upload bebas hambatan
            let imageData = canvas.toDataURL('image/jpeg', 0.8);
            capturedImages.push(imageData);

            document.getElementById('photo-count').innerText = capturedImages.length;

            if (capturedImages.length > 0) {
                document.getElementById('btn-done').style.display = 'flex';
            }
        });

        document.getElementById('btn-done').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'flex';
        });

        document.getElementById('btn-submit').addEventListener('click', async () => {
            let userName = document.getElementById('user-name').value.trim();
            if (!userName) return alert("Namanya harus diisi!");
            if (!mainFolderId) mainFolderId = prompt("Masukkan ID Folder Drive tujuan:");

            document.getElementById('input-box').style.display = 'none';
            document.getElementById('loading-text').style.display = 'block';

            try {
                let response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ mainFolderId: mainFolderId, userName: userName, images: capturedImages }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                let result = await response.json();
                
                if (result.status === "sukses") {
                    alert("Berhasil! Foto telah dikirim ke folder " + result.folder);
                    location.reload();
                } else {
                    alert("Gagal: " + result.error);
                }
            } catch (err) {
                alert("Koneksi bermasalah.");
            }
        });

        window.onload = () => startCamera(currentFacingMode);
    </script>
</body>
</html>
