<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Photobooth & Guestbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDFBF7;
            --cream-dark: #E9E1D3;
            --green: #152B1E;
            --gold: #C5A059;
            --red: #722626;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; color: var(--green); background-color: var(--cream); }
        
        .jawa-bg { background: radial-gradient(circle at center, var(--cream) 0%, var(--cream-dark) 100%); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 0.5s; pointer-events: none; }
        
        /* 1. BATIK */
        .layer-batik { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.1; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 0 C75 0 100 25 100 50 C100 75 75 100 50 100 C25 100 0 75 0 50 C0 25 25 0 50 0 Z M50 15 C30 15 15 30 15 50 C15 70 30 85 50 85 C70 85 85 70 85 50 C85 30 70 15 50 15 Z' fill='%23C5A059'/%3E%3C/svg%3E"); }
        
        /* 2. GUNUNGAN WAYANG */
        .layer-gunungan { 
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); 
            width: 150%; height: 80%; 
            background-image: url('Gunungan.jpg.jpg?v=2');
            background-position: center center;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.25; z-index: 2; 
            mix-blend-mode: multiply; filter: grayscale(20%) contrast(1.2);
        }
            
        /* 3. RUMAH JOGLO */
        .layer-joglo { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; height: 40%; 
            background-image: url('Joglo.jpg.jpg?v=2');
            background-position: bottom center;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.45; z-index: 3; 
            mix-blend-mode: multiply;
        }
            
        /* 4. BUNGA POJOK KANAN ATAS */
        .layer-bunga-kanan-atas { 
            position: absolute; top: -20px; right: -20px; 
            width: 50%; height: 40%; 
            background-image: url('BungaA.jpg.jpg?v=2');
            background-position: top right;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 4; opacity: 0.95; mix-blend-mode: multiply; 
        }
            
        /* 5. BUNGA POJOK KIRI ATAS */
        .layer-bunga-kiri-atas { 
            position: absolute; top: -20px; left: -20px; 
            width: 50%; height: 40%; 
            background-image: url('BungaA.jpg.jpg?v=2');
            background-position: top right;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 4; opacity: 0.95; mix-blend-mode: multiply; 
            transform: scaleX(-1);
        }

        /* 6. BUNGA POJOK KIRI BAWAH */
        .layer-bunga-kiri-bawah { 
            position: absolute; bottom: -20px; left: -20px; 
            width: 50%; height: 40%; 
            background-image: url('BungaB.jpg.jpg?v=2');
            background-position: top right;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5; opacity: 0.95; mix-blend-mode: multiply; 
            transform: scaleY(-1) scaleX(-1); 
        }

        /* 7. BUNGA POJOK KANAN BAWAH */
        .layer-bunga-kanan-bawah { 
            position: absolute; bottom: -20px; right: -20px; 
            width: 50%; height: 40%; 
            background-image: url('BungaB.jpg.jpg?v=2');
            background-position: top right;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5; opacity: 0.95; mix-blend-mode: multiply; 
            transform: scaleY(-1); 
        }
            
        /* ========================================================================================= */

        .view { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; text-align: center; box-sizing: border-box; padding: 20px; animation: fadeIn 0.6s ease-out; z-index: 10; }
        .active-view { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* WARNA title-pre DIGANTI KE var(--green) */
        .title-pre { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; color: var(--green); margin-bottom: 5px; z-index: 15; position: relative; text-shadow: 0 0 10px var(--cream), 0 0 20px var(--cream); }
        .title-names { font-family: 'Playfair Display', serif; font-size: 44px; font-weight: bold; margin: 0; color: var(--red); line-height: 1.1; z-index: 15; position: relative; text-shadow: 0 0 15px var(--cream), 0 0 30px var(--cream); }
        .title-date { font-size: 15px; letter-spacing: 5px; margin-top: 15px; margin-bottom: 45px; color: var(--green); font-weight: 600; z-index: 15; position: relative; text-shadow: 0 0 10px var(--cream); }
        
        .btn-main { background: linear-gradient(135deg, #722626, #4A1515); color: var(--cream); border: 1px solid var(--gold); padding: 12px 45px; border-radius: 30px; font-size: 16px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer; box-shadow: 0 8px 20px rgba(114,38,38,0.4); transition: transform 0.2s; letter-spacing: 1px; z-index: 15; position: relative; }
        .btn-main:active { transform: scale(0.95); }

        #camera-container { width: 100%; height: 100%; background: #000; position: absolute; top: 0; left: 0; z-index: 20; display: none; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        .cam-top-bar, .cam-bottom-bar { position: absolute; width: 100%; display: flex; z-index: 22; left: 0; }
        .cam-top-bar { top: 30px; justify-content: center; }
        .cam-bottom-bar { bottom: 40px; justify-content: space-evenly; align-items: center; }
        .cam-counter { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: 600; border: 1px solid var(--gold); color: var(--cream); }
        .btn-switch, .btn-done { background: rgba(255,255,255,0.2); border: 1px solid var(--cream); border-radius: 50%; width: 55px; height: 55px; font-size: 22px; color: var(--cream); display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .btn-done { display: none; background: #722626; border:none; }
        .btn-shutter { background: transparent; border: 3px solid var(--cream); border-radius: 50%; width: 75px; height: 75px; position: relative; }
        .btn-shutter::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--cream); width: 60px; height: 60px; border-radius: 50%; }
        
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 40; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(5px); }
        .modal-box { background: var(--cream); padding: 30px 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.4); border: 2px solid var(--gold); }
        .modal-box input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid var(--green); border-radius: 8px; font-size: 16px; text-align: center; font-family: 'Poppins', sans-serif; background: transparent; color: var(--green); outline: none; }
        
        .gallery-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-height: 55vh; overflow-y: auto; margin-bottom: 20px; padding: 10px 0; z-index: 15; position: relative; }
        .img-wrap { position: relative; width: 100px; height: 140px; cursor: pointer; }
        .img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 3px solid #722626; transition: 0.2s; }
        .check-icon { position: absolute; top: 5px; right: 5px; background: #722626; color: var(--cream); border-radius: 50%; width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border:1px solid var(--gold); }

        .gb-title { font-family: 'Playfair Display', serif; font-size: 34px; color: var(--red); margin-bottom: 5px; z-index: 15; position: relative; text-shadow: 0 0 15px var(--cream); }
        .gb-subtitle { font-size: 13px; opacity: 0.9; margin-bottom: 20px; position: relative; z-index: 15; font-weight: 600; text-shadow: 0 0 10px var(--cream); }
        .gb-input, .gb-textarea { position: relative; z-index: 15; width: 100%; max-width: 340px; padding: 14px; margin-bottom: 15px; border: 1px solid var(--green); border-radius: 8px; font-size: 14px; background: rgba(253, 251, 247, 0.95); color: var(--green); font-family: 'Poppins', sans-serif; box-sizing: border-box; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .gb-textarea { resize: none; height: 90px; }
        .comments-container { position: relative; z-index: 15; width: 100%; max-width: 340px; height: 220px; background: rgba(253, 251, 247, 0.85); border-radius: 10px; border: 1px solid rgba(21,43,30,0.2); overflow-y: auto; margin-top: 15px; padding: 12px; text-align: left; box-sizing: border-box; backdrop-filter: blur(8px); }
        .comment-item { background: rgba(255,255,255,0.95); padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border-left: 4px solid var(--gold); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .comment-name { font-weight: bold; color: var(--red); margin-bottom: 4px; font-size: 14px; }
        .comment-date { font-size: 11px; opacity: 0.6; display: block; margin-top: 5px; font-style: italic; }

        .footer-wa { position: absolute; bottom: 35px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 15; }
        .wa-icon { background: #25D366; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; box-shadow: 0 6px 15px rgba(37,211,102,0.4); border: 2px solid white; transition: transform 0.2s; }
        .wa-icon:active { transform: scale(0.9); }
        .wa-icon svg { width: 26px; height: 26px; fill: white; }
    </style>
</head>
<body>

    <div class="jawa-bg" id="bg-jawa">
        <div class="layer-batik"></div>
        <div class="layer-gunungan"></div>
        <div class="layer-joglo"></div>
        
        <div class="layer-bunga-kiri-atas"></div>
        <div class="layer-bunga-kanan-atas"></div>
        <div class="layer-bunga-kiri-bawah"></div>
        <div class="layer-bunga-kanan-bawah"></div>
    </div>

    <div id="view-1" class="view active-view">
        <div class="title-pre">The Wedding Of</div>
        <h1 class="title-names">Maghfiroh<br>& Eko</h1>
        <div class="title-date">12.09.2026</div>
        <button class="btn-main" onclick="openCamera()">Take Photo</button>
    </div>

    <div id="camera-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="flash-effect" style="position: absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; z-index:25;"></div>
        <div class="cam-top-bar"><div class="cam-counter"><span id="photo-count">0</span> / 18</div></div>
        <div class="cam-bottom-bar">
            <button class="btn-switch" onclick="switchCamera()">🔄</button>
            <button class="btn-shutter" onclick="takePhoto()"></button>
            <button class="btn-done" id="btn-done" onclick="openGallerySelection()">✔</button>
        </div>
    </div>

    <div id="view-select" class="view">
        <div class="gb-title">Pilih Foto</div>
        <div style="font-size:13px; opacity:0.9; margin-bottom:20px; z-index:15; font-weight:600; text-shadow:0 0 10px var(--cream);">Ketuk foto yang tidak ingin dikirim</div>
        <div class="gallery-grid" id="gallery-container"></div>
        <button class="btn-main" style="width:100%; max-width:300px;" onclick="confirmSelection()">Konfirmasi Pilihan</button>
    </div>

    <div class="modal" id="modal-name">
        <div class="modal-box">
            <h3 style="margin-top:0; color:var(--red); font-family:'Playfair Display', serif; font-size:24px;">Satu Langkah Lagi</h3>
            <p style="font-size:13px; margin-bottom:0; color:var(--green);">Masukkan nama untuk menyimpan foto.</p>
            <input type="text" id="photo-name" placeholder="Nama Kamu" required autocomplete="off">
            <button class="btn-main" style="width:100%; border:none;" onclick="submitPhotoAndProceed()">Kirim Foto</button>
        </div>
    </div>

    <div id="view-3" class="view">
        <div class="gb-title">Ucapkan Sesuatu</div>
        <div style="font-size:13px; opacity:0.9; margin-bottom:20px; z-index:15; font-weight:600; text-shadow:0 0 10px var(--cream);">Berikan Ucapan & Doa Restu</div>
        <input type="text" id="gb-name" class="gb-input" placeholder="Nama Anda" readonly>
        <textarea id="gb-message" class="gb-textarea" placeholder="Tulis doa dan ucapan disini..." required></textarea>
        <button class="btn-main" id="btn-send-comment" style="width:100%; max-width:340px;" onclick="sendComment()">Kirim Ucapan</button>
        <div class="comments-container" id="comments-box">
            <div style="text-align:center; opacity:0.6; font-size:12px; margin-top:30px;">Memuat ucapan...</div>
        </div>
    </div>

    <!-- WARNA TULISAN "Here Begins Our Always" DIGANTI KE var(--green) -->
    <div id="view-4" class="view">
        <div style="font-family:'Playfair Display',serif; font-style:italic; font-size:22px; color:var(--green); margin-bottom:10px; z-index:15; text-shadow:0 0 10px var(--cream);">Here Begins Our Always</div>
        <div style="font-family:'Playfair Display',serif; font-size:46px; color:var(--red); margin-bottom:5px; font-weight:bold; z-index:15; text-shadow:0 0 15px var(--cream);">Terima Kasih</div>
        <div style="font-size:16px; letter-spacing:4px; margin-bottom:20px; opacity:0.9; font-weight:600; z-index:15; text-shadow:0 0 10px var(--cream);">By Artea</div>
        <div class="footer-wa">
            <div style="font-size:13px; opacity:0.8; margin-bottom:8px; font-weight:bold; text-shadow:0 0 10px var(--cream);">Hubungi Vendor</div>
            <a href="https://wa.me/6281945507305" target="_blank" class="wa-icon">
                <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
            </a>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-Jj1n32O9FPnboHIP0Mw5KJQuTjVkqGlGA0CCOCscNjqn7-Gmx5sJUk7h48kXpGMU/exec";
        
        let video = document.getElementById('camera-feed');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let currentFacingMode = 'user';
        let capturedImages = [];
        let selectedIndices = new Set();
        const MAX_PHOTOS = 18;
        let isCommentsLoaded = false;
        let cachedCommentsHTML = "";

        const urlParams = new URLSearchParams(window.location.search);
        const folderId = urlParams.get('folderId'); 
        const sheetId = urlParams.get('sheetId');
        const expTime = urlParams.get('exp');

        if (expTime && Date.now() > parseInt(expTime)) {
            document.body.innerHTML = "<div style='color:#152B1E; text-align:center; padding:50px; font-family:Playfair Display;'><h2>⛔ Akses Ditolak</h2><p>QR Code ini sudah kadaluarsa.</p></div>";
            throw new Error("QR Expired"); 
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active-view'));
            if(viewId !== 'view-2') document.querySelector('.jawa-bg').style.opacity = '1';
            
            if(viewId === 'view-2') {
                document.querySelector('.jawa-bg').style.opacity = '0';
                document.getElementById('camera-container').style.display = 'block';
            } else {
                document.getElementById('camera-container').style.display = 'none';
                document.getElementById(viewId).classList.add('active-view');
            }
        }

        async function openCamera() {
            showView('view-2');
            isCommentsLoaded = false;
            let constraints = { video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
            try { video.srcObject = await navigator.mediaDevices.getUserMedia(constraints); } 
            catch (err) { video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false }); }
        }

        function switchCamera() { currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; openCamera(); }

        function takePhoto() {
            if (capturedImages.length >= MAX_PHOTOS) return;
            let flash = document.getElementById('flash-effect');
            flash.style.opacity = '1'; setTimeout(() => { flash.style.opacity = '0'; }, 100);
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));
            document.getElementById('photo-count').innerText = capturedImages.length;
            if (capturedImages.length > 0) document.getElementById('btn-done').style.display = 'flex';
        }

        async function prefetchComments() {
            if(!sheetId || isCommentsLoaded) return;
            try {
                let res = await fetch(`${GAS_WEB_APP_URL}?action=getComments&sheetId=${sheetId}`);
                let json = await res.json();
                if(json.data && json.data.length > 0) {
                    cachedCommentsHTML = "";
                    json.data.reverse().forEach(c => { cachedCommentsHTML += `<div class="comment-item"><div class="comment-name">${c.name}</div><div style="color:var(--green);">${c.message}</div><span class="comment-date">${new Date(c.timestamp).toLocaleDateString('id-ID')}</span></div>`; });
                } else { cachedCommentsHTML = `<div style="text-align:center; opacity:0.6; font-size:12px; margin-top:30px;">Belum ada ucapan. Jadilah yang pertama!</div>`; }
                isCommentsLoaded = true;
            } catch (e) { cachedCommentsHTML = `<div style="text-align:center; opacity:0.6; font-size:12px;">Gagal memuat ucapan.</div>`; }
        }

        function openGallerySelection() {
            if(capturedImages.length === 0) return;
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            prefetchComments(); showView('view-select');
            const gallery = document.getElementById('gallery-container');
            gallery.innerHTML = ''; selectedIndices.clear();
            capturedImages.forEach((imgSrc, index) => {
                selectedIndices.add(index);
                const box = document.createElement('div'); box.className = 'img-wrap';
                const img = document.createElement('img'); img.src = imgSrc;
                const check = document.createElement('div'); check.className = 'check-icon'; check.innerText = '✔';
                box.onclick = () => {
                    if(selectedIndices.has(index)) { selectedIndices.delete(index); img.style.borderColor = 'transparent'; img.style.opacity = '0.5'; check.style.display = 'none'; } 
                    else { selectedIndices.add(index); img.style.borderColor = '#722626'; img.style.opacity = '1'; check.style.display = 'flex'; }
                };
                box.appendChild(img); box.appendChild(check); gallery.appendChild(box);
            });
        }

        function confirmSelection() {
            if(selectedIndices.size === 0) return alert("Pilih minimal 1 foto untuk dikirim!");
            let finalImages = []; selectedIndices.forEach(i => finalImages.push(capturedImages[i]));
            capturedImages = finalImages; document.getElementById('modal-name').style.display = 'flex';
        }

        function submitPhotoAndProceed() {
            const userName = document.getElementById('photo-name').value.trim();
            if(!userName) return alert("Isi nama dulu ya!");
            document.getElementById('gb-name').value = userName; document.getElementById('modal-name').style.display = 'none';
            fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ type: "photo", folderId: folderId, userName: userName, images: capturedImages }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }).catch(e => console.error(e));
            showView('view-3'); loadComments();
        }

        function loadComments() {
            let box = document.getElementById('comments-box');
            if(isCommentsLoaded) { box.innerHTML = cachedCommentsHTML; } 
            else {
                box.innerHTML = `<div style="text-align:center; opacity:0.6; font-size:12px; margin-top:30px;">Memuat ucapan...</div>`;
                let checkInterval = setInterval(() => { if(isCommentsLoaded) { box.innerHTML = cachedCommentsHTML; clearInterval(checkInterval); } }, 500);
            }
        }

        function sendComment() {
            const name = document.getElementById('gb-name').value;
            const message = document.getElementById('gb-message').value.trim();
            if(!message) return alert("Ucapannya jangan dikosongi ya!");
            const btn = document.getElementById('btn-send-comment'); btn.innerText = "Mengirim..."; btn.disabled = true;
            fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ type: "comment", sheetId: sheetId, userName: name, message: message }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }).catch(e => console.error(e));
            setTimeout(() => { showView('view-4'); btn.innerText = "Kirim Ucapan"; btn.disabled = false; }, 500);
        }
    </script>
</body>
</html>
