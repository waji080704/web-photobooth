<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Photobooth & Guestbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; color: #FFFDD0; background-color: #1a0a02; }
        
        /* TEMA ADAT JAWA (LAPISAN BACKGROUND) */
        .jawa-bg { background: radial-gradient(circle at center, #3e2011 0%, #110500 100%); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; transition: opacity 0.5s; pointer-events: none; }
        
        /* 1. Motif Batik Kawung (Seamless) */
        .batik-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.06; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='0' cy='0' r='25' fill='none' stroke='%23d4af37' stroke-width='1.5'/%3E%3Ccircle cx='60' cy='0' r='25' fill='none' stroke='%23d4af37' stroke-width='1.5'/%3E%3Ccircle cx='0' cy='60' r='25' fill='none' stroke='%23d4af37' stroke-width='1.5'/%3E%3Ccircle cx='60' cy='60' r='25' fill='none' stroke='%23d4af37' stroke-width='1.5'/%3E%3Ccircle cx='30' cy='30' r='25' fill='none' stroke='%23d4af37' stroke-width='1.5'/%3E%3Cpath d='M 22 30 L 30 22 L 38 30 L 30 38 Z' fill='%23d4af37'/%3E%3C/svg%3E"); }
        
        /* 2. Siluet Gunungan Wayang */
        .gunungan-bg { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 450px; opacity: 0.12; }
        
        /* 3. Siluet Rumah Joglo */
        .joglo-bg { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100vw; max-width: 600px; opacity: 0.25; }

        .view { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; text-align: center; box-sizing: border-box; padding: 20px; animation: fadeIn 0.6s ease-out; z-index: 1; }
        .active-view { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* View 1: Landing Page */
        .title-pre { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #D4AF37; margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .title-names { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: bold; margin: 0; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); line-height: 1.1; }
        .title-date { font-size: 16px; letter-spacing: 4px; margin-top: 15px; margin-bottom: 45px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .btn-gold { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); color: #2c1503; border: none; padding: 15px 45px; border-radius: 30px; font-size: 18px; font-weight: bold; font-family: 'Playfair Display', serif; cursor: pointer; box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4); transition: transform 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-gold:active { transform: scale(0.95); }

        /* View 2: Camera */
        #camera-container { width: 100%; height: 100%; background: #000; position: absolute; top: 0; left: 0; z-index: 10; display: none; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        .cam-top-bar { position: absolute; top: 30px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 12; }
        .cam-counter { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: 600; border: 1px solid rgba(212, 175, 55, 0.5); color: #D4AF37; }
        .cam-bottom-bar { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: space-evenly; align-items: center; z-index: 12; }
        .btn-switch, .btn-done { background: rgba(0,0,0,0.7); border: 1px solid #D4AF37; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; color: #D4AF37; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .btn-done { display: none; font-weight: bold; background: #D4AF37; color: #2c1503; }
        .btn-shutter { background: transparent; border: 3px solid #D4AF37; border-radius: 50%; width: 75px; height: 75px; position: relative; }
        .btn-shutter::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #fcf6ba, #b38728); width: 60px; height: 60px; border-radius: 50%; }
        
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 30; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(5px); }
        .modal-box { background: linear-gradient(135deg, #2c1503 0%, #110500 100%); padding: 30px 25px; border-radius: 15px; width: 85%; max-width: 320px; border: 1px solid #D4AF37; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal-box input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 8px; font-size: 16px; text-align: center; font-family: 'Poppins', sans-serif; background: rgba(255,255,255,0.1); color: #FFFDD0; box-sizing: border-box; outline: none; }
        .modal-box input:focus { border-color: #D4AF37; background: rgba(255,255,255,0.2); }
        .modal-box input::placeholder { color: rgba(255, 253, 208, 0.5); }
        
        /* View 3: Guestbook */
        .gb-title { font-family: 'Playfair Display', serif; font-size: 32px; color: #D4AF37; margin-bottom: 5px; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        .gb-subtitle { font-size: 14px; margin-bottom: 25px; color: rgba(255, 253, 208, 0.8); }
        .gb-input, .gb-textarea { width: 100%; max-width: 340px; padding: 14px; margin-bottom: 15px; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 8px; font-size: 14px; background: rgba(0, 0, 0, 0.6); color: #FFFDD0; font-family: 'Poppins', sans-serif; box-sizing: border-box; backdrop-filter: blur(5px); outline: none; }
        .gb-input:focus, .gb-textarea:focus { border-color: #D4AF37; }
        .gb-textarea { resize: none; height: 90px; }
        
        .comments-container { width: 100%; max-width: 340px; height: 220px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.3); overflow-y: auto; margin-top: 20px; padding: 12px; text-align: left; box-sizing: border-box; backdrop-filter: blur(5px); }
        .comment-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border-left: 3px solid #D4AF37; }
        .comment-name { font-weight: 600; color: #D4AF37; margin-bottom: 4px; font-size: 14px; }
        .comment-date { font-size: 11px; opacity: 0.5; display: block; margin-top: 5px; font-style: italic; }

        /* View 4: Company Profile */
        .cp-title { font-family: 'Playfair Display', serif; font-size: 42px; color: #D4AF37; margin-bottom: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .cp-vendor { font-size: 18px; letter-spacing: 3px; margin-bottom: 50px; opacity: 0.9; }
        .wa-icon { background: linear-gradient(135deg, #25D366, #1da851); width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; box-shadow: 0 5px 20px rgba(37,211,102,0.3); margin: 0 auto; transition: transform 0.2s; border: 2px solid rgba(255,255,255,0.2); }
        .wa-icon:active { transform: scale(0.9); }
        .wa-icon svg { width: 38px; height: 38px; fill: white; }
    </style>
</head>
<body>

    <!-- BACKGROUND KHAS JAWA -->
    <div class="jawa-bg" id="bg-jawa">
        <div class="batik-overlay"></div>
        
        <!-- Siluet Gunungan -->
        <svg class="gunungan-bg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
            <path d="M100 10 C140 80 190 180 190 280 C190 290 180 300 100 300 C20 300 10 290 10 280 C10 180 60 80 100 10 Z" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <path d="M100 30 C130 90 170 180 170 270 C170 280 160 285 100 285 C40 285 30 280 30 270 C30 180 70 90 100 30 Z" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,4"/>
            <path d="M100 285 L100 50 M60 270 C80 200 120 200 140 270 M70 200 C85 140 115 140 130 200" stroke="#D4AF37" fill="none" stroke-width="1.5"/>
        </svg>

        <!-- Siluet Rumah Joglo -->
        <svg class="joglo-bg" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 15 L180 15 L200 45 L100 45 Z" fill="#D4AF37"/>
            <path d="M95 50 L205 50 L260 80 L40 80 Z" fill="#D4AF37"/>
            <rect x="110" y="80" width="6" height="20" fill="#D4AF37"/>
            <rect x="184" y="80" width="6" height="20" fill="#D4AF37"/>
            <rect x="60" y="80" width="4" height="20" fill="#D4AF37"/>
            <rect x="236" y="80" width="4" height="20" fill="#D4AF37"/>
            <path d="M10 100 L290 100" stroke="#D4AF37" stroke-width="4"/>
        </svg>
    </div>

    <!-- VIEW 1: LANDING PAGE -->
    <div id="view-1" class="view active-view">
        <div class="title-pre">The Wedding Of</div>
        <h1 class="title-names">Maghfiroh<br>& Eko</h1>
        <div class="title-date">12.09.2026</div>
        <button class="btn-gold" onclick="openCamera()">Take Photo</button>
    </div>

    <!-- VIEW 2: CAMERA -->
    <div id="camera-container">
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="flash-effect" style="position: absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; z-index:20;"></div>
        
        <div class="cam-top-bar">
            <div class="cam-counter"><span id="photo-count">0</span> / 18</div>
        </div>
        <div class="cam-bottom-bar">
            <button class="btn-switch" onclick="switchCamera()">🔄</button>
            <button class="btn-shutter" onclick="takePhoto()"></button>
            <button class="btn-done" id="btn-done" onclick="showNameModal()">✔</button>
        </div>

        <div class="modal" id="modal-name">
            <div class="modal-box">
                <h3 style="margin-top:0; color:#D4AF37; font-family:'Playfair Display', serif; font-size:24px;">Selesai Berfoto</h3>
                <p style="font-size:13px; margin-bottom:0; color:rgba(255,253,208,0.7);">Masukkan nama untuk format foto.</p>
                <input type="text" id="photo-name" placeholder="Nama Kamu" required autocomplete="off">
                <button class="btn-gold" style="width:100%; padding:12px; font-size:16px;" onclick="submitPhotoAndProceed()">Kirim & Lanjut</button>
            </div>
        </div>
    </div>

    <!-- VIEW 3: GUESTBOOK -->
    <div id="view-3" class="view">
        <div class="gb-title">Ucapkan Sesuatu</div>
        <div class="gb-subtitle">Berikan Ucapan & Doa Restu</div>
        <input type="text" id="gb-name" class="gb-input" placeholder="Nama Anda" readonly>
        <textarea id="gb-message" class="gb-textarea" placeholder="Tulis doa dan ucapan disini..." required></textarea>
        <button class="btn-gold" id="btn-send-comment" style="width:100%; max-width:340px; padding:12px; font-size:16px;" onclick="sendComment()">Kirim Ucapan</button>
        
        <div class="comments-container" id="comments-box">
            <div style="text-align:center; opacity:0.6; font-size:12px; margin-top:30px;">Memuat ucapan...</div>
        </div>
    </div>

    <!-- VIEW 4: COMPANY PROFILE -->
    <div id="view-4" class="view">
        <div class="cp-title">Terima Kasih</div>
        <div class="cp-vendor">By Artea</div>
        <!-- GANTI NOMOR WA DI BAWAH INI -->
        <a href="https://wa.me/6287852738914" target="_blank" class="wa-icon">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        </a>
    </div>

    <script>
        // GANTI DENGAN URL GAS MILIKMU
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-Jj1n32O9FPnboHIP0Mw5KJQuTjVkqGlGA0CCOCscNjqn7-Gmx5sJUk7h48kXpGMU/exec";
        
        let video = document.getElementById('camera-feed');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let currentFacingMode = 'user';
        let capturedImages = [];
        const MAX_PHOTOS = 18;

        const urlParams = new URLSearchParams(window.location.search);
        const folderId = urlParams.get('folderId'); 
        const sheetId = urlParams.get('sheetId');
        const expTime = urlParams.get('exp');

        if (expTime && Date.now() > parseInt(expTime)) {
            document.body.innerHTML = "<div style='color:#D4AF37; text-align:center; padding:50px; font-family:Playfair Display;'><h2>⛔ Akses Ditolak</h2><p>QR Code ini sudah kadaluarsa.</p></div>";
            throw new Error("QR Expired"); 
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active-view'));
            if(viewId !== 'view-2') document.getElementById('bg-jawa').style.opacity = '1';
            
            if(viewId === 'view-2') {
                document.getElementById('bg-jawa').style.opacity = '0';
                document.getElementById('camera-container').style.display = 'block';
            } else {
                document.getElementById('camera-container').style.display = 'none';
                document.getElementById(viewId).classList.add('active-view');
            }
        }

        async function openCamera() {
            showView('view-2');
            let constraints = { video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
            }
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            openCamera();
        }

        function takePhoto() {
            if (capturedImages.length >= MAX_PHOTOS) return;
            let flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImages.push(canvas.toDataURL('image/jpeg', 0.8));

            document.getElementById('photo-count').innerText = capturedImages.length;
            if (capturedImages.length > 0) document.getElementById('btn-done').style.display = 'flex';
        }

        function showNameModal() {
            document.getElementById('modal-name').style.display = 'flex';
        }

        function submitPhotoAndProceed() {
            const userName = document.getElementById('photo-name').value.trim();
            if(!userName) return alert("Isi nama dulu ya!");

            document.getElementById('gb-name').value = userName;
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ type: "photo", folderId: folderId, userName: userName, images: capturedImages }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).catch(e => console.error("Upload foto error", e));

            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('modal-name').style.display = 'none';
            showView('view-3');
            loadComments();
        }

        async function loadComments() {
            if(!sheetId) return;
            try {
                let res = await fetch(`${GAS_WEB_APP_URL}?action=getComments&sheetId=${sheetId}`);
                let json = await res.json();
                let box = document.getElementById('comments-box');
                box.innerHTML = "";
                
                if(json.data && json.data.length > 0) {
                    json.data.reverse().forEach(c => {
                        box.innerHTML += `<div class="comment-item"><div class="comment-name">${c.name}</div><div style="color:rgba(255,253,208,0.9);">${c.message}</div><span class="comment-date">${new Date(c.timestamp).toLocaleDateString('id-ID')}</span></div>`;
                    });
                } else {
                    box.innerHTML = `<div style="text-align:center; opacity:0.6; font-size:12px; margin-top:30px;">Belum ada ucapan. Jadilah yang pertama!</div>`;
                }
            } catch (e) {
                document.getElementById('comments-box').innerHTML = `<div style="text-align:center; opacity:0.6; font-size:12px;">Gagal memuat ucapan.</div>`;
            }
        }

        async function sendComment() {
            const name = document.getElementById('gb-name').value;
            const message = document.getElementById('gb-message').value.trim();
            if(!message) return alert("Ucapannya jangan dikosongi ya!");

            const btn = document.getElementById('btn-send-comment');
            btn.innerText = "Mengirim..."; btn.disabled = true;

            try {
                let res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: "comment", sheetId: sheetId, userName: name, message: message }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                let result = await res.json();
                
                if (result.status === "sukses") {
                    showView('view-4');
                } else {
                    alert("Gagal menyimpan ke Sheet. Detail: " + result.error);
                    btn.innerText = "Kirim Ucapan"; btn.disabled = false;
                }
            } catch (e) {
                alert("Gagal menghubungi server. Pastikan internet lancar.");
                btn.innerText = "Kirim Ucapan"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
